version: 2
updates:
  # Actions are pinned to full commit SHAs (supply-chain hardening), which means
  # they no longer pick up upstream security fixes on their own. Dependabot is
  # what keeps the pins current — it rewrites the SHA and the trailing version
  # comment together. Removing this file silently freezes every action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # The Go module. Without this block nothing watches go.mod at all: the actions
  # block above covers workflow pins and nothing else, so a published advisory
  # on a direct or transitive Go dependency would sit here unannounced — and
  # these dependencies are compiled INTO the published binaries, which is the
  # one dependency surface a consumer cannot patch for themselves.
  #
  # It does NOT cover the toolchain. GOTOOLCHAIN is pinned in the two workflows
  # and in tools/build-release.sh, deliberately, and moving it changes the bytes
  # of every published artifact — that is a decision, not a bump, and it stays
  # with the people who make it.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod:
        patterns: ["*"]
