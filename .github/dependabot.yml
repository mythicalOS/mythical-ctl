version: 2
updates:
  # Actions are pinned to full commit SHAs (supply-chain hardening), which means
  # they no longer pick up upstream security fixes on their own. Dependabot is
  # what keeps the pins current — it rewrites the SHA and the trailing version
  # comment together. Removing this file silently freezes every action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # vendor/bats-core is the test runner, pinned to a tag's commit for the same
  # supply-chain reason as the actions above — and frozen for the same reason
  # without this. Test-only: it is never sourced by shipped code.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(vendor)"
