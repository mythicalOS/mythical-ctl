name: Release

# Publishes a versioned mythical-ctl to GitHub Releases, with checksums and a
# signed build-provenance attestation, on a `v*` tag.
#
# Why a GitHub Release and not a package registry: mythical-ctl runs BEFORE any
# language runtime is guaranteed to exist on the machine — that is the whole
# reason it is shell — so a registry that presupposes one cannot be the primary
# channel. get.mythicalos.ai serves a pinned release artifact from here.
#
# The provenance attestation is the counterpart to package provenance elsewhere
# in the family, and it matters more here than anywhere: users are asked to pipe
# this script into their shell, so "prove this is the artifact your workflow
# built from this tag" is the security story, not a formality.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets
  id-token: write # OIDC, for the provenance attestation
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # A tag that disagrees with the version the script reports would ship an
      # artifact that lies about itself — every later "which version do I have?"
      # answer descends from this, so it is checked before anything is built.
      - name: Tag must match the version the CLI reports
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          reported="$(./bin/mythical-ctl --version | awk '{print $2}')"
          echo "tag=${tag} reported=${reported}"
          if [ "$tag" != "$reported" ]; then
            echo "::error::tag v${tag} does not match the version the CLI reports (${reported})"
            exit 1
          fi

      # The release runs the same gates as CI. A tag can be pushed to a commit
      # that never saw a pull request, so re-running them here is the difference
      # between a gate and a suggestion.
      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }

      - name: shellcheck
        run: shellcheck -x bin/* lib/*.sh tests/*.sh tests/harness/*

      - name: Smoke tests
        run: ./tests/smoke.sh

      - name: Bats unit tests
        run: vendor/bats-core/bin/bats tests/unit

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bin/mythical-ctl dist/mythical-ctl
          chmod +x dist/mythical-ctl
          ( cd dist && sha256sum mythical-ctl > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/mythical-ctl

      # ACCIDENT GUARD, not an immutability guarantee (design D20).
      #
      # An earlier version used --clobber so a transient runner failure would not
      # burn a version number. That is the wrong trade: it lets the bytes behind a
      # published version change after the fact, so the attestation only ever
      # describes whichever upload happened last.
      #
      # Removing it does NOT make releases immutable, and this step must not be
      # read as claiming so: anyone with write access can delete this release and
      # publish again, or replace an asset, without the tag moving. What this
      # catches is the ordinary accident — a re-run, a re-pushed tag.
      #
      # The actual integrity guarantee is content-addressed and lives at the
      # consumer: verify the recorded SHA-256 digest, never the version string.
      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::${GITHUB_REF_NAME} is already published — cut a new patch version instead of replacing published bytes."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is unpublished — proceeding"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/mythical-ctl dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "mythical-ctl $GITHUB_REF_NAME

          Verify the download before running it:

              sha256sum -c SHA256SUMS
              gh attestation verify mythical-ctl --repo mythicalOS/mythical-ctl"
